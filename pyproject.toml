[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-factor"
version = "0.4.0"
description = "Point-in-time weekly single-factor backtests and standalone reports"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "statsmodels", "openpyxl"]

[project.scripts]
fundamental-factor = "fundamental_factor.cli:main"

[tool.setuptools.packages.find]
include = ["fundamental_factor*"]

[tool.setuptools.package-data]
fundamental_factor = ["report_assets/*.html", "report_assets/*.css", "report_assets/*.js", "report_assets/*.woff", "report_assets/*.txt", "report_data/*.csv", "report_data/*.json"]
